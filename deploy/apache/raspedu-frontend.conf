# Next.js frontend. Replace example.gr with your domain.
# Certbot (`certbot --apache`) creates the HTTPS copy of this site and the http -> https redirect.
<VirtualHost *:80>
    ServerName example.gr
    ServerAlias www.example.gr

    # Server Actions compare Origin with Host; keep the public host
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/raspedu-frontend-error.log
    CustomLog ${APACHE_LOG_DIR}/raspedu-frontend-access.log combined
</VirtualHost>
