# Strapi: admin panel, REST API and uploaded files. Replace cms.example.gr with your subdomain.
# Certbot (`certbot --apache`) creates the HTTPS copy of this site and the http -> https redirect.
<VirtualHost *:80>
    ServerName cms.example.gr

    ProxyPreserveHost On
    ProxyRequests Off
    # large uploads
    ProxyTimeout 300
    # 100 MB
    LimitRequestBody 104857600
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ProxyPass        / http://127.0.0.1:1337/
    ProxyPassReverse / http://127.0.0.1:1337/

    ErrorLog  ${APACHE_LOG_DIR}/raspedu-cms-error.log
    CustomLog ${APACHE_LOG_DIR}/raspedu-cms-access.log combined
</VirtualHost>
